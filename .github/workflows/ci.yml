# Fast checks on every pull request push and on main. There was no CI before this file.
# This repository is public, so GitHub-hosted runners cost nothing; no game files are needed.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push to a pull request cancels the older run. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The same check README asks players to run: exact file list, no game files, no undeclared outside access.
      - name: Verify the repository
        run: python3 tools/verify.py
      # The release zip must build. (--strict is not used yet: 31 dev paths sit outside coop:dev markers today.)
      - name: Build the release zip
        run: python3 tools/build.py --release --no-install
